name: Tests

# The suite existed for weeks with no runner anywhere (the local venv didn't
# even have pytest), so order-dependent breakage accumulated unnoticed.
# Data-only commits (relay bundles, dashboard refreshes) skip this via `paths`.

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "autonomy_config.json"
      # ALL workflow YAML, not just this file (2026-08-05 audit). The trading
      # pipeline IS these workflows — gather, execute, stop-watch, x-post — and
      # an edit to any of them previously triggered NO check at all: a workflow
      # push shipped straight into the path that moves (paper) money with zero
      # gate. Running the suite here doesn't parse the YAML itself, but it does
      # re-verify every script those workflows invoke (heartbeat_check,
      # execute_order_intents, stop_watch, the secrets-hygiene pins) against the
      # same tree the edited workflow will run on — which is the check that was
      # silently skipped before.
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

name: Grok trading cycle

# THE scheduled trader. Replaces claude.ai CCR and the Mac launchd agent.
# Runs on GitHub-hosted runners so the book trades with the Mac asleep.
#
# Clock: America/New_York in EDT (UTC-4) through 2026-11-01. One cron per
# slot — the EST twins were removed after a second 19:09 study double-fired
# on 2026-08-12. After the November fallback, add one hour to each UTC time.
# scripts/cloud_slot.sh still self-gates + slot_already_landed.py refuses a
# second landing the same ET day.

on:
  schedule:
    - cron: "0 10 * * 1-5"      # 6:00 ET light
    - cron: "45 12 * * 1-5"     # 8:45 ET holdings_watchlist
    - cron: "30 14 * * 1-5"     # 10:30 ET full
    - cron: "0 16 * * 1-5"      # 12:00 ET holdings_watchlist
    - cron: "0 18 * * 1-5"      # 14:00 ET holdings_watchlist
    - cron: "30 19 * * 1-5"     # 15:30 ET full (pre-bell)
    - cron: "30 21 * * 1-5"     # 17:30 ET evening_review
    - cron: "0 23 * * 1-5"      # 19:00 ET study
    - cron: "0 4 * * *"         # 00:00 ET midnight / Sunday weekly_market
    - cron: "59 3 * * 0,1"      # 23:59 ET Sat+Sun news
    - cron: "15 11-23 * * 1-5"  # watchdog 7:15–19:15 ET
  workflow_dispatch:
    inputs:
      role:
        description: "Slot role (auto = infer from ET clock)"
        type: choice
        options: [auto, brain, evening, study, midnight, weekend, watchdog]
        default: auto

permissions:
  contents: write

concurrency:
  # Same queue as gather / execute-orders / stop-watch. A trading run that
  # pushes the ledger must not race those writers.
  group: main-writer
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Grok CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config user.name "east-equity-grok[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Prefer the SuperGrok / grok.com session (same "don't pay extra" model as
      # Claude CCR). API key is optional fallback only.
      #
      # OIDC sessions ROTATE. A successful agent call refreshes tokens on the
      # runner disk; the GROK_AUTH_JSON secret still holds the OLD refresh
      # token. Next slot then fails mid-run with "Not signed in" (models may
      # still pass on a barely-alive access token). Fix: prefer a GitHub
      # Actions cache of auth.json from the previous cycle, fall back to the
      # secret, verify with a real headless agent prompt (not just `grok
      # models`), and save the cache at job end.
      - name: Restore cached Grok OIDC session
        uses: actions/cache@v4
        with:
          path: ~/.grok/auth.json
          # Unique key every run so the post-job save always writes the
          # just-refreshed tokens; restore-keys pulls the newest prior cache.
          key: grok-oidc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            grok-oidc-

      - name: Restore Grok subscription login
        env:
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          mkdir -p "$HOME/.grok"
          if [ -f "$HOME/.grok/auth.json" ] && [ -s "$HOME/.grok/auth.json" ]; then
            chmod 600 "$HOME/.grok/auth.json"
            echo "using cached OIDC session from prior Actions run"
          elif [ -n "$GROK_AUTH_JSON" ]; then
            printf '%s\n' "$GROK_AUTH_JSON" > "$HOME/.grok/auth.json"
            chmod 600 "$HOME/.grok/auth.json"
            echo "using GROK_AUTH_JSON secret (subscription, no API bill)"
          elif [ -z "${XAI_API_KEY:-}" ]; then
            echo "FATAL: no Grok login on this runner."
            echo "Free path (uses your existing Grok plan, no console.x.ai spend):"
            echo "  gh secret set GROK_AUTH_JSON < ~/.grok/auth.json"
            echo "from a machine where you have already run \`grok login\`."
            exit 1
          else
            echo "using XAI_API_KEY (metered)"
          fi
          # `grok models` is NOT enough — it can pass on a dying access token
          # while the real agent path (`grok -p`) is already Not signed in.
          # Exercise the same headless path the brain uses.
          if ! grok --yolo --no-auto-update -p "Reply with exactly: pong" \
                --output-format text >/tmp/grok-ping.out 2>/tmp/grok-ping.err; then
            echo "FATAL: Grok agent auth failed (headless -p)."
            echo "stderr:"
            cat /tmp/grok-ping.err || true
            echo "stdout:"
            cat /tmp/grok-ping.out || true
            echo "Re-sync from a logged-in Mac:"
            echo "  gh secret set GROK_AUTH_JSON --repo eastyryan/eastequity < ~/.grok/auth.json"
            exit 1
          fi
          echo "grok agent auth ok:"
          head -5 /tmp/grok-ping.out || true

      - name: Run scheduled slot
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EE_SCHEDULED_TRADER: "1"
          PYTHON: python
        run: |
          chmod +x scripts/cloud_slot.sh
          grok --version
          scripts/cloud_slot.sh "${{ github.event.inputs.role || 'auto' }}"

      # Optional: also write rotated tokens back into the repo secret when a
      # PAT with secrets:write is configured. Cache is the primary persistence.
      - name: Persist refreshed Grok session to secret
        if: always()
        env:
          GH_PAT_SECRETS: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          if [ -z "$GH_PAT_SECRETS" ]; then
            echo "GH_PAT_SECRETS not set — OIDC tokens persist via Actions cache only"
            exit 0
          fi
          if [ ! -f "$HOME/.grok/auth.json" ]; then
            echo "no auth.json to persist"
            exit 0
          fi
          GH_TOKEN="$GH_PAT_SECRETS" gh secret set GROK_AUTH_JSON \
            --repo "${{ github.repository }}" < "$HOME/.grok/auth.json"
          echo "GROK_AUTH_JSON secret refreshed from runner session"

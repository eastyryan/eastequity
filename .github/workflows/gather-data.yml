name: Gather market data for cloud runs

# Cloud routine sandboxes block most external hosts (SEC, FRED, Yahoo), but they
# always have the repo checkout. GitHub runners have full network access, so this
# workflow gathers the complete context bundle ~20 minutes before each scheduled
# trading run and commits it. The orchestrator's --gather-only mode falls back to
# this file automatically when live feeds are unreachable.

on:
  schedule:
    - cron: "40 9,12,13,15,17,19,21 * * 1-5"     # 20 min before weekday run slots (UTC);
                                                  # 21:40 feeds the 5:30pm ET full review
                                                  # (7:30pm slot removed 2026-07-13)
    - cron: "10 14-20 * * 1-5"                    # +every market hour at :10 (9:30-4 ET) so
                                                  # the bundle is never more than ~30min old
                                                  # while the market is open
    - cron: "40 3 * * *"                          # before the midnight-ET and weekend runs
  workflow_dispatch:
  # EVENT-DRIVEN BACKSTOP (added 2026-07-23). GitHub delays or DROPS scheduled (cron)
  # workflows under load: on 2026-07-23 every scheduled gather stopped firing for
  # hours and the bundle went stale mid-session, while push/PR-triggered Actions kept
  # running fine. The cloud trader pushes to main on EVERY run (run-marker, lease,
  # dashboard update) — a reliable event stream — so a push-triggered gather keeps the
  # bundle fresh even when cron is congested. The `decide` job guards it: it skips the
  # gather's own bundle commits (no loop) and only escalates to a full gather when the
  # committed bundle is actually stale, so ordinary trade-path pushes don't each kick
  # off a gather.
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Cheap gate: decide whether this trigger should actually gather. Carries NO
  # concurrency group on purpose — it takes no lock and never pushes, so the frequent
  # trade-path pushes that now trigger this workflow can't back up the shared
  # main-writer queue that stop-watch / execute-orders depend on for stop enforcement.
  decide:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          # schedule + manual dispatch ALWAYS gather — unchanged behaviour.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "trigger=${{ github.event_name }} -> gather"
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # push: never re-trigger on our own bundle-refresh commit (loop guard).
          if git log -1 --pretty=%s | grep -qiE "Refresh market data bundle"; then
            echo "own data commit -> skip"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # push: gather only if the committed bundle is actually stale, so ordinary
          # trade-path pushes (several per run) don't each kick off a full gather.
          AGE_MIN=$(python3 -c "import json,datetime; d=json.load(open('data/cloud_context.json')); rd=datetime.datetime.fromisoformat(d['run_date']); print(int((datetime.datetime.now(datetime.timezone.utc)-rd).total_seconds()/60))" 2>/dev/null || echo 9999)
          echo "bundle age: ${AGE_MIN} min (threshold 45)"
          if [ "$AGE_MIN" -ge 45 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  gather:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # main-writer moved here from the workflow level: only the job that actually
    # PUSHES needs to serialize against stop-watch / execute-orders. Leaving it at
    # workflow level would drag the cheap `decide` gate into the same shared queue.
    concurrency:
      group: main-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the `git pull --rebase` below can cleanly replay our
          # data commit on top of trade-path commits (a shallow clone can make
          # rebase against an advanced remote fail).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # THE BUNDLE MUST CARRY ITS OWN FRESH PRICES (added 2026-07-23).
      #
      # orchestrator.py --gather-only already calls brain_io.apply_live_prices(), but
      # that function only READS state/live_prices.json — it never fetches. The file is
      # written by live-prices.yml on a "*/5" cron, and GitHub throttles that schedule
      # hard: on 2026-07-23 it fired FOUR times all day, median gap 97 minutes. The
      # overlay refuses any snapshot older than schedule.live_prices.max_age_min (30),
      # so the overlay was silently skipped on essentially every gather and the bundle
      # shipped daily bars. The 19:51 UTC bundle that day — built at 3:51pm ET, mid
      # session — carried all 186 tickers at price_as_of 2026-07-22, i.e. YESTERDAY.
      #
      # A swing trader reasoning on yesterday's close against today's news is how the
      # 07-22 proposals ended up fabricating catalysts to explain the mismatch (see
      # runlib/brain_io.apply_live_prices). So fetch the quotes HERE, in the job that
      # already holds the Alpaca keys and already runs ~20 min before every slot,
      # instead of depending on a sibling cron that GitHub will not run on time.
      # Fail-soft: refresh_from_book never raises, and a failure here just leaves the
      # daily bars the gather would have used anyway.
      - name: Refresh intraday quotes so the gather has something fresh to overlay
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python -c "
          from tools.live_prices import refresh_from_book
          r = refresh_from_book()
          print('live prices:', r.get('source'), r.get('n'), 'of', len(r.get('requested', [])))
          " || echo "live-price refresh failed; gather will fall back to daily bars"
      - name: Gather context bundle
        env:
          # Alpaca market data: the gather's live-price overlay + the broker
          # mirror sync use real-time IEX quotes when keys are present
          # (fail-soft to yfinance/committed snapshots when absent).
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          # Depth follows the ET slot map (schedule.slot_depths) so the bundle
          # matches the trading slot it feeds: light pre-market, four fast
          # holdings/watchlist slots, one full deep dive before 4pm ET.
          # Exception: the Sunday 03:40 UTC gather (Sat 23:40 ET) builds the
          # weekly breadth bundle for the Sunday-midnight market check-in.
          DEPTH_ARGS="--auto-depth"
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "03" ]; then
            DEPTH_ARGS="--depth weekly_market"
          fi
          python orchestrator.py --gather-only $DEPTH_ARGS | tee /tmp/gather.log
          CTX=$(grep -o 'CONTEXT_FILE=.*' /tmp/gather.log | cut -d= -f2-)
          test -s "$CTX"
          cp "$CTX" data/cloud_context.json
      - name: Commit and push (with retry against concurrent run pushes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This runner GATHERS data only — it never trades. Stage ONLY the data
          # bundle + charts. Never add state/portfolio.json or state/KILL_SWITCH:
          # this checkout's copy is stale relative to the cloud trader, and
          # committing it here would overwrite the authoritative ledger. The
          # ledger is owned exclusively by the trade path.
          #
          # state/live_prices.json is deliberately NOT staged either: the quotes we
          # just fetched are already baked into data/cloud_context.json, and that file
          # is owned by live-prices.yml on the orphan 'live-data' branch. Committing it
          # to main would reintroduce the mid-run price push that made the trader
          # abandon on a non-fast-forward (2026-07-15).
          git add data/cloud_context.json data/charts dashboard/data/position_charts.json
          # Momentum-ETF close cache: committed so blocked-network cloud runs can
          # still compute the momentum_health external layer (5-day staleness cap).
          git add -f data/cache/momentum_etfs.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no data changes"; exit 0; }
          git commit -m "Refresh market data bundle for cloud runs [vercel skip]"
          # The gather also dirties tracked files we deliberately DON'T commit
          # (concept memory, fundamental screen, live_prices). They block
          # `pull --rebase` ("You have unstaged changes") whenever a push races us —
          # discard them; this runner is ephemeral and they're regenerated every run.
          git checkout -- .
          # Rebase-and-retry so we replay on top of any concurrent trade-path
          # push instead of fighting it (our commit touches only data/, so it
          # never conflicts with the ledger's state/ changes).
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1

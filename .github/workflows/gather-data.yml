name: Gather market data for cloud runs

# Cloud routine sandboxes block most external hosts (SEC, FRED, Yahoo), but they
# always have the repo checkout. GitHub runners have full network access, so this
# workflow gathers the complete context bundle ~20 minutes before each scheduled
# trading run and commits it. The orchestrator's --gather-only mode falls back to
# this file automatically when live feeds are unreachable.

on:
  schedule:
    - cron: "40 9,12,13,15,17,19,21 * * 1-5"     # 20 min before weekday run slots (UTC);
                                                  # 21:40 feeds the 5:30pm ET full review
                                                  # (7:30pm slot removed 2026-07-13)
    - cron: "10 14-20 * * 1-5"                    # +every market hour at :10 (9:30-4 ET) so
                                                  # the bundle is never more than ~30min old
                                                  # while the market is open
    - cron: "40 3 * * *"                          # before the midnight-ET and weekend runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gather-data
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the `git pull --rebase` below can cleanly replay our
          # data commit on top of trade-path commits (a shallow clone can make
          # rebase against an advanced remote fail).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gather context bundle
        env:
          # Alpaca market data: the gather's live-price overlay + the broker
          # mirror sync use real-time IEX quotes when keys are present
          # (fail-soft to yfinance/committed snapshots when absent).
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          # Depth follows the ET slot map (schedule.slot_depths) so the bundle
          # matches the trading slot it feeds: light pre-market, four fast
          # holdings/watchlist slots, one full deep dive before 4pm ET.
          # Exception: the Sunday 03:40 UTC gather (Sat 23:40 ET) builds the
          # weekly breadth bundle for the Sunday-midnight market check-in.
          DEPTH_ARGS="--auto-depth"
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "03" ]; then
            DEPTH_ARGS="--depth weekly_market"
          fi
          python orchestrator.py --gather-only $DEPTH_ARGS | tee /tmp/gather.log
          CTX=$(grep -o 'CONTEXT_FILE=.*' /tmp/gather.log | cut -d= -f2-)
          test -s "$CTX"
          cp "$CTX" data/cloud_context.json
      - name: Commit and push (with retry against concurrent run pushes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This runner GATHERS data only — it never trades. Stage ONLY the data
          # bundle + charts. Never add state/portfolio.json or state/KILL_SWITCH:
          # this checkout's copy is stale relative to the cloud trader, and
          # committing it here would overwrite the authoritative ledger. The
          # ledger is owned exclusively by the trade path.
          git add data/cloud_context.json data/charts dashboard/data/position_charts.json
          # Momentum-ETF close cache: committed so blocked-network cloud runs can
          # still compute the momentum_health external layer (5-day staleness cap).
          git add -f data/cache/momentum_etfs.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no data changes"; exit 0; }
          git commit -m "Refresh market data bundle for cloud runs [vercel skip]"
          # The gather also dirties tracked files we deliberately DON'T commit
          # (concept memory, fundamental screen). They block `pull --rebase`
          # ("You have unstaged changes") whenever a push races us — discard
          # them; this runner is ephemeral and they're regenerated every run.
          git checkout -- .
          # Rebase-and-retry so we replay on top of any concurrent trade-path
          # push instead of fighting it (our commit touches only data/, so it
          # never conflicts with the ledger's state/ changes).
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1

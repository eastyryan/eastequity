name: Live prices for holdings + watchlist

# Intraday quotes for holdings + published watchlist -> state/live_prices.json on
# the orphan live-data branch. Never touches state/portfolio.json (owned by the
# trade path), so it cannot clobber the ledger.
#
# DEMOTED TO A BACKSTOP 2026-07-23. This used to be the ONLY thing fetching
# intraday prices, and both the gather and the stop watch inherited whatever it
# last published. That made them hostages of a schedule GitHub does not honour:
# measured 2026-07-23, this workflow delivered 7 of 96 requested fires (7%), a
# median gap of 97 minutes, against a 30-minute overlay freshness guard. The
# result was a trading brain reading YESTERDAY's closes mid-session for nine days.
#
# gather-data.yml and stop-watch.yml now each call refresh_from_book() themselves,
# so neither depends on this file being fresh. What still reads the live-data
# branch: the dashboard's /api/live-prices quote strip, tools/trigger_watch.py, and
# stop-watch's fallback when its own fetch fails. Those all degrade gracefully, so
# a rationed schedule here is now merely suboptimal rather than load-bearing.

on:
  schedule:
    # HONEST INTERVAL. GitHub hands this repo a FIXED budget of ~7 scheduled runs
    # per workflow per day regardless of the interval requested — same-day measured
    # delivery was */5 -> 7/96, */10 -> 7/48, */15 -> 7/32, all landing on exactly 7.
    # So "*/5" and "*/20" produce identical real coverage; the short interval only
    # made the schedule a fiction to debug against. Ask for what we receive.
    - cron: "*/20 13-21 * * 1-5"   # ~9:00am-5:00pm ET; expect ~7 actual fires/day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-prices
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # No fetch-depth override (2026-08-05 audit; was 0). This job commits to
      # an ORPHAN branch — `git checkout --orphan` needs no parent history at
      # all — and force-pushes, so there is no rebase and no merge-base to
      # find. The default depth-1 checkout is exactly sufficient, on the one
      # workflow that used to pay a full 210MB clone up to 7x/day for a
      # single-file publish.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch intraday quotes (full universe via Alpaca; book-only yfinance fallback)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -c "from tools.live_prices import refresh_from_book; r = refresh_from_book(); print('live prices:', r.get('source'), r.get('n'), 'of', len(r.get('requested', [])))"
      - name: Publish to the live-data branch (NEVER main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s state/live_prices.json || { echo "no live_prices.json produced"; exit 0; }
          # Publish ONLY to the dedicated 'live-data' branch as a single-file
          # orphan commit, force-updated each run. This NEVER pushes to main, so a
          # high-frequency price refresh can no longer land mid-trade-run and make
          # the trader abandon on a non-fast-forward (git reset --hard). The
          # orchestrator reads state/live_prices.json from origin/live-data.
          git checkout --orphan live-data
          git reset          # unstage the whole tree the orphan inherited
          # Repo-root vercel.json so Vercel never builds this app-less branch.
          # Vercel reads git.deploymentEnabled from the repository root; without
          # it, every push here triggers a preview build that fails on the
          # missing "dashboard" Root Directory.
          printf '{"$schema":"https://openapi.vercel.sh/vercel.json","git":{"deploymentEnabled":false}}\n' > vercel.json
          git add -f state/live_prices.json vercel.json
          git commit -m "Live holdings/watchlist prices [skip ci][vercel skip]"
          for i in 1 2 3; do
            git push -f origin live-data && exit 0
            sleep $((2 ** i))
          done
          exit 1

name: Heartbeat

# Gives the health signal a way OUT of the box.
#
# runlib/analytics.build_health() has computed missed slots and bundle age for a
# long time, and its own docstring names why it exists: "the plan-mode parse bug
# ran for DAYS unnoticed". The remedy shipped then was a number on a dashboard.
# A grep for notify|alert|pushover|slack|smtp across the whole repo returned
# nothing, so a dead pipeline still looked exactly like a quiet one.
#
# A failing scheduled job on your own repo is the cheapest real alerting that
# exists: GitHub emails you on the transition to failure, with no credential, no
# third-party service and no webhook to maintain. Set the EE_ALERT_WEBHOOK secret
# to additionally push to Slack/Discord.

on:
  schedule:
    # HOURLY across the session, 10:00-23:00 UTC on weekdays.
    #
    # Was twice daily (14:30 and 20:30 UTC), on the reasoning that "an alarm that fires
    # on routine cron jitter gets muted". The reasoning was right; the remedy was in the
    # wrong dimension. Cron jitter is a TIME effect, so it is now absorbed by a per-slot
    # one-hour grace window in runlib.analytics.slot_report — a late slot reads as
    # "pending", not "missed". With jitter handled there, checking rarely buys nothing
    # and costs everything: a 2pm slot that died was not reported until 16:30, by which
    # point the trading opportunity it represented is gone.
    #
    # Hourly rather than seven slot-aligned crons because GitHub cron is UTC-only and
    # the slots are defined in ET: fixed UTC times drift by an hour across DST, so
    # slot-aligned entries would need doubling up and would still be wrong for the two
    # weeks the US and the schedule disagree. The slot logic itself is timezone-aware,
    # so a coarse hourly sweep is correct year-round — only the detection latency
    # varies, and it is bounded at ~1h either way.
    - cron: "0 10-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  # issues: write exists for exactly one step — the create-or-update alert
  # issue below. Everything else in this workflow is read-only.
  issues: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 14 runs a weekday now instead of 2; without the cache the dependency
          # install dominates both the wall clock and the Actions bill.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report health
        run: python scripts/heartbeat_check.py --json

      # Separate step so the JSON above is always in the log even when this fails.
      # tee captures the UNHEALTHY summary for the issue step below without a
      # second heartbeat run (which could assess a different moment and diverge
      # from what actually failed); pipefail preserves the non-zero exit the
      # whole alerting design hangs on.
      - name: Fail if unhealthy
        env:
          EE_ALERT_WEBHOOK: ${{ secrets.EE_ALERT_WEBHOOK }}
        run: |
          set -o pipefail
          python scripts/heartbeat_check.py 2>&1 | tee /tmp/heartbeat_output.txt

      # ALERT-FATIGUE FIX (2026-08-05 audit). GitHub emails only on the
      # TRANSITION to failure, so once this hourly job is red it goes silent:
      # a pipeline that dies Monday morning sends one email and then nothing,
      # and EE_ALERT_WEBHOOK is optional so there may be no other egress at
      # all. A single fixed-title issue closes that gap — created on the first
      # failure, commented (with timestamp + the captured UNHEALTHY summary)
      # on every subsequent one, reopened if someone closed it while the
      # pipeline is still failing. The issue thread doubles as the outage
      # timeline. The webhook step above is unchanged; this is an additional
      # channel, not a replacement.
      - name: Create or update the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Heartbeat: trading pipeline unhealthy"
          {
            echo "Heartbeat failure at $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -c 4000 /tmp/heartbeat_output.txt 2>/dev/null || echo "(no captured output)"
            echo '```'
          } > /tmp/issue_body.md
          # Exact-title match, not just search relevance: --search alone ranks,
          # and acting on a fuzzy hit could hijack an unrelated issue.
          MATCH=$(gh issue list --state all --limit 50 --search "\"$TITLE\" in:title" \
                    --json number,title,state \
                    --jq "[.[] | select(.title == \"$TITLE\")][0]")
          if [ -z "$MATCH" ] || [ "$MATCH" = "null" ]; then
            gh issue create --title "$TITLE" --body-file /tmp/issue_body.md
          else
            NUM=$(echo "$MATCH" | jq -r .number)
            STATE=$(echo "$MATCH" | jq -r .state)
            if [ "$STATE" = "CLOSED" ]; then
              gh issue reopen "$NUM"
            fi
            gh issue comment "$NUM" --body-file /tmp/issue_body.md
          fi

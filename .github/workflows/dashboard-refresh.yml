name: Dashboard daily rebuild

# ONE VERCEL BUILD A DAY by default (2026-09-21), plus book-change catch-up
# (2026-09-22). Until 2026-09-21 every trading run and every executor fill pushed
# a commit WITHOUT [vercel skip], and each of those was a full ~70 MB Next.js
# build: ~10 grok-cycle slots a weekday plus executor ticks came to roughly 8-9
# builds a day, which is what kept the Hobby deployment-storage quota (10 GB)
# permanently blown — 14.18 GB on 2026-09-20, and ~247 accumulated deployments
# before the prune.
#
# The fix keeps the brain untouched. Trading, reconciliation, stop enforcement
# and data gathering all still run on their own schedules and still push to
# main every time; they just carry [vercel skip] now, so none of them builds.
# This workflow is the scheduled build of the site: one empty commit a day
# carrying [vercel build], which dashboard/vercel.json's ignoreCommand honors
# ahead of the skip check. The build then reads whatever data the day's runs
# accumulated in the repo, so the dashboard is a daily snapshot by design.
#
# BOOK-CHANGE CATCH-UP (2026-09-22). A fill/reset that changes holdings/cash
# must not wait until 19:40 ET if a [vercel build] already fired earlier the
# same UTC day on the pre-change book. runlib/publish.redeploy_dashboard
# pushes its own empty [vercel build] when the staged portfolio/latest
# fingerprint changes. This workflow's once-a-day guard therefore ALSO allows
# a rebuild when state/portfolio.json (or latest.json holdings surface) moved
# AFTER the most recent [vercel build] today — so a late book change still
# gets one catch-up build without re-enabling per-run builds for lease/skip
# commits.
#
# Consequence to keep in mind: commentary-only / lease publishes still do not
# rebuild. If fills need sub-minute site updates, make the dashboard read its
# JSON at request time instead of at build time — do NOT re-enable per-run builds.

on:
  schedule:
    # 19:40 and 19:55 ET (EDT) — after the 19:00 ET study slot, and both inside
    # the SAME UTC day so the guard below sees the first one. Two asks because
    # GitHub rations this repo's cron delivery (~7/day/workflow measured
    # 2026-07-23); the guard makes the second fire a free no-op.
    - cron: "40 23 * * *"
    - cron: "55 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shares the main-writer queue with the other pushers (x-post, stop-watch,
  # gather-data). Unserialized pushes to main are what produced the
  # rejected-push churn those workflows already queue to avoid.
  group: main-writer
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the once-a-day guard greps the day's commits, and the
          # default shallow checkout would only ever show the tip.
          fetch-depth: 0

      - name: Publish the day's data with one build
        run: |
          set -euo pipefail
          git config user.name "ee-dashboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || { echo "rebase failed"; exit 1; }

            SINCE="$(date -u +%Y-%m-%d)T00:00:00Z"
            LAST_BUILD="$(git log --since="$SINCE" -F --grep='[vercel build]' -1 --format=%H || true)"
            if [ -n "$LAST_BUILD" ]; then
              # Book-changed path: if portfolio/latest moved after that build,
              # allow one catch-up rebuild. Lease/skip-only commits do not touch
              # these paths in a material way relative to fingerprint, but a
              # real fill/reset does.
              NEWER_BOOK="$(git log "${LAST_BUILD}"..HEAD --format=%H -- \
                state/portfolio.json dashboard/data/latest.json || true)"
              if [ -z "$NEWER_BOOK" ]; then
                echo "already rebuilt today and no book change since — nothing to do"
                exit 0
              fi
              echo "book changed since last [vercel build] — catch-up rebuild"
            fi

            git commit --allow-empty -m "Publish dashboard for $(date -u +%Y-%m-%d) [vercel build]"

            if git push origin HEAD:main; then
              echo "pushed — Vercel building the day's dashboard"
              exit 0
            fi

            # Lost the race to another main writer. Drop our commit and retry so
            # a retry can never stack a second empty commit onto the branch.
            echo "push rejected (attempt ${attempt}/3), retrying"
            git reset --hard HEAD~1
          done

          echo "push failed after retries"; exit 1
